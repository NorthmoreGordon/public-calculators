<!DOCTYPE html>
<html lang="en" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battery STC &amp; BESS Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>

  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --border: #d9e0e8;
    --border-lit: #c7d2df;
    --text: #142033;
    --muted: #667085;
    --bstc: #21aaff;
    --bstc-soft: rgba(33, 170, 255, 0.10);
    --bstc-border: rgba(33, 170, 255, 0.30);
    --accent: #21aaff;
    --accent-hover: #34374c;
    --error: #b42318;
    --error-bg: #fff1f0;
    --error-border: #fecdca;
    --shadow: 0 18px 45px rgba(20, 32, 51, 0.08);
    --shadow-soft: 0 8px 24px rgba(20, 32, 51, 0.06);
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(circle at top left, rgba(33, 170, 255, 0.07), transparent 34rem),
      linear-gradient(180deg, #ffffff 0%, var(--bg) 34%);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 0;
    padding: 42px 22px 64px;
  }

  .page-header {
    max-width: 1080px;
    margin: 0 auto 28px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
    position: relative;
    padding-right: 220px;
  }

  .page-header h2 {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: clamp(24px, 3.2vw, 38px);
    letter-spacing: -0.035em;
    color: var(--text);
    line-height: 1.08;
  }

  .page-header h1 span.b { color: var(--bstc); }

  .page-header p {
    margin-top: 10px;
    max-width: 860px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    display: none;
  }

  .brand-logo {
    position: absolute;
    top: 0;
    right: 0;
    width: 180px;
    height: auto;
    object-fit: contain;
  }

  @media (max-width: 640px) {
    .page-header { padding-right: 0; padding-top: 64px; }
    .brand-logo { left: 0; right: auto; width: 160px; }
  }

  .layout {
    max-width: 1080px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(300px, 360px) 1fr;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 820px) {
    body { padding: 28px 16px 48px; }
    .layout { grid-template-columns: 1fr; }
  }

  .input-panel,
  .result-card,
  .empty-state,
  .totals-card,
  .info-strip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-soft);
  }

  .input-panel {
    overflow: hidden;
    position: sticky;
    top: 20px;
  }

  @media (max-width: 820px) {
    .input-panel { position: static; }
  }

  .panel-label {
    padding: 16px 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    background: var(--surface-soft);
  }

  .field-group {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .field { display: flex; flex-direction: column; gap: 7px; }

  .field label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #344054;
  }

  .field input,
  .field select {
    background: #ffffff;
    border: 1px solid var(--border-lit);
    border-radius: 10px;
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    padding: 11px 12px;
    width: 100%;
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
    min-height: 42px;
  }

  .field input:focus,
  .field select:focus {
    border-color: var(--bstc);
    box-shadow: 0 0 0 4px rgba(33, 170, 255, 0.14);
  }

  .field input::placeholder { color: #98a2b3; }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 2px 0;
  }

  .price-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  @media (max-width: 420px) {
    .price-row { grid-template-columns: 1fr; }
  }

  .pfx-wrap { position: relative; }
  .pfx-wrap .pfx {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: var(--muted);
    pointer-events: none;
    font-weight: 600;
  }
  .pfx-wrap input { padding-left: 28px; }

  .taper-info {
    background: rgba(33, 170, 255, 0.07);
    border: 1px solid rgba(33, 170, 255, 0.22);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 11.5px;
    color: #34374c;
    line-height: 1.65;
  }

  .taper-info strong {
    display: block;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--bstc);
    margin-bottom: 6px;
  }

  .taper-info span {
    display: block;
    padding: 2px 0;
  }

  .calc-btn {
    margin: 0 20px 20px;
    width: calc(100% - 40px);
    padding: 13px 16px;
    background: var(--bstc);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    box-shadow: 0 10px 22px rgba(33, 170, 255, 0.24);
  }

  .calc-btn:hover { background: #34374c; }
  .calc-btn:active { transform: translateY(1px); box-shadow: none; }

  .error-box {
    margin: 0 20px 14px;
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--error);
    display: none;
    line-height: 1.55;
  }
  .error-box.show { display: block; }

  .results-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .empty-state {
    padding: 64px 28px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
  }
  .empty-state .icon { font-size: 30px; margin-bottom: 12px; opacity: 0.45; }
  .empty-state strong { color: var(--text); }

  /* Info strip */
  .info-strip { display: none; }

  .info-row {
    padding: 12px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 24px;
    border-bottom: 1px solid var(--border);
  }
  .info-row:last-child { border-bottom: none; }

  .info-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .i-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .i-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  /* Result cards */
  .result-card { overflow: hidden; }

  .result-card.bstc-card {
    border-left: 5px solid var(--bstc);
    box-shadow: 0 14px 36px rgba(33, 170, 255, 0.14);
    border-top: 1px solid var(--border);
  }

  .result-card.bstc-card .card-header {
    background: linear-gradient(90deg, var(--bstc-soft), var(--surface-soft));
  }

  .result-card.bstc-card .metric {
    border-color: var(--bstc-border);
  }

  .result-card.bstc-card .m-value { color: var(--bstc); }

  .card-header {
    padding: 17px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-soft);
  }

  @media (max-width: 640px) {
    .card-header { align-items: flex-start; flex-direction: column; }
    .card-body { grid-template-columns: 1fr !important; }
  }

  .card-title {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .card-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: #475467;
    text-transform: uppercase;
    padding: 5px 9px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #ffffff;
    white-space: nowrap;
  }

  .card-body {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }

  .metric {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
  }

  .m-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .m-value {
    font-size: clamp(24px, 3vw, 34px);
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--text);
  }

  .m-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }

  /* Taper breakdown section */
  .taper-breakdown {
    margin: 0 20px 18px;
    border: 1px solid var(--bstc-border);
    border-radius: 10px;
    overflow: hidden;
  }

  .tb-header {
    padding: 9px 14px;
    background: var(--bstc-soft);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--bstc);
    border-bottom: 1px solid var(--bstc-border);
  }

  .tb-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    padding: 9px 14px;
    font-size: 12.5px;
    border-bottom: 1px solid #ede9f6;
    align-items: center;
  }

  .tb-row:last-child { border-bottom: none; }

  .tb-band { color: var(--text); font-weight: 600; }
  .tb-calc { color: var(--muted); font-size: 11.5px; font-family: 'DM Mono', monospace; }
  .tb-result { color: var(--bstc); font-weight: 700; font-family: 'DM Mono', monospace; text-align: right; }
  .tb-row.inactive .tb-band,
  .tb-row.inactive .tb-calc,
  .tb-row.inactive .tb-result { color: #c0c8d4; }

  .tb-total {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    background: rgba(33,170,255,0.06);
    border-top: 1px solid var(--bstc-border);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--bstc);
    font-family: 'DM Mono', monospace;
  }

  /* Totals card */
  .totals-card {
    border-color: #b8c7d8;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    box-shadow: var(--shadow);
  }

  .t-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .t-value {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 4vw, 42px);
    color: var(--text);
    letter-spacing: -0.045em;
    line-height: 1;
  }

  .t-sub {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }

  .period-badge {
    display: inline-flex;
    align-items: center;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: 0.02em;
    font-weight: 700;
    background: rgba(33, 170, 255, 0.10);
    color: var(--bstc);
    border: 1px solid var(--bstc-border);
  }


  /* Client-facing result summary */
  .client-summary {
    background: linear-gradient(135deg, #ffffff 0%, #f7f3ff 100%);
    border: 1px solid var(--bstc-border);
    border-left: 5px solid var(--bstc);
    border-radius: var(--radius);
    box-shadow: 0 18px 45px rgba(33, 170, 255, 0.14);
    overflow: hidden;
  }

  .summary-header {
    padding: 18px 22px 12px;
    border-bottom: 1px solid rgba(33, 170, 255, 0.22);
  }

  .summary-eyebrow {
    display: inline-flex;
    margin-bottom: 8px;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(33, 170, 255, 0.10);
    border: 1px solid var(--bstc-border);
    color: var(--bstc);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .summary-title {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: clamp(18px, 2.4vw, 24px);
    font-weight: 700;
    letter-spacing: -0.025em;
    color: var(--text);
  }

  @media (max-width: 640px) {
    .summary-title { align-items: flex-start; flex-direction: column; }
  }

  .summary-body {
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .hero-value {
    background: #ffffff;
    border: 1px solid rgba(33, 170, 255, 0.28);
    border-radius: 13px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 150px;
  }

  .hero-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .hero-amount {
    margin-top: 8px;
    font-size: clamp(42px, 6vw, 64px);
    line-height: 0.95;
    letter-spacing: -0.06em;
    font-weight: 800;
    color: var(--bstc);
  }

  .hero-note {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
    align-items: stretch;
  }

  .summary-item {
    background: rgba(255,255,255,0.78);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 13px 14px;
    min-height: 92px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .summary-item .s-label {
    display: block;
    font-size: 10px;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }

  .summary-item .s-value {
    display: block;
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
  }

  .client-narrative {
    padding: 0 22px 20px;
    font-size: 13px;
    color: #475467;
    line-height: 1.65;
  }

  .professional-note {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 15px 18px;
    color: #475467;
    font-size: 12.5px;
    line-height: 1.6;
    box-shadow: var(--shadow-soft);
  }

  .professional-note strong { color: var(--text); }

  details.methodology {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-soft);
    overflow: hidden;
  }

  details.methodology summary {
    cursor: pointer;
    list-style: none;
    padding: 15px 18px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text);
    background: var(--surface-soft);
    border-bottom: 1px solid var(--border);
  }

  details.methodology summary::-webkit-details-marker { display: none; }
  details.methodology summary::after { content: '+'; float: right; font-size: 16px; line-height: 1; color: var(--bstc); }
  details.methodology[open] summary::after { content: '-'; }

  details.methodology .taper-breakdown {
    margin: 18px;
  }

  @media (max-width: 980px) {
    .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (max-width: 640px) {
    .summary-grid { grid-template-columns: 1fr; }
  }

  select option { background: #ffffff; color: var(--text); }

  /* Scheme tabs */
  .scheme-tabs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    padding: 14px 20px 4px;
  }
  .scheme-tab {
    border: 1px solid var(--border-lit);
    background: #ffffff;
    border-radius: 9px;
    padding: 9px 6px;
    font-size: 11px;
    font-weight: 700;
    color: #475467;
    text-align: center;
    cursor: pointer;
    line-height: 1.3;
    transition: all 0.15s;
  }
  .scheme-tab .st-sub { display: block; font-size: 9.5px; font-weight: 600; color: #98a2b3; margin-top: 2px; letter-spacing: 0.01em; }
  .scheme-tab:hover { border-color: var(--bstc); }
  .scheme-tab.active {
    background: var(--bstc);
    border-color: var(--bstc);
    color: #ffffff;
    box-shadow: 0 8px 18px rgba(33,170,255,0.28);
  }
  .scheme-tab.active .st-sub { color: rgba(255,255,255,0.85); }

  @media (max-width: 480px) {
    .scheme-tabs { grid-template-columns: repeat(2, 1fr); }
  }

  /* Eligibility checklist */
  .elig-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .elig-item {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    font-size: 12px;
    color: #344054;
    line-height: 1.45;
    cursor: pointer;
  }
  .elig-item input[type="checkbox"] {
    margin-top: 2px;
    width: 16px;
    height: 16px;
    accent-color: var(--bstc);
    flex: 0 0 auto;
    cursor: pointer;
  }

  /* Conflict / verification flag banners */
  .flag-banner {
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 11.5px;
    line-height: 1.6;
    margin: 0 20px 16px;
  }
  .flag-banner.warn {
    background: rgba(180,83,9,0.07);
    border: 1px solid rgba(180,83,9,0.28);
    color: #b45309;
  }
  .flag-banner.info {
    background: rgba(33,170,255,0.07);
    border: 1px solid rgba(33,170,255,0.22);
    color: #34374c;
  }
  .flag-banner strong { display: block; margin-bottom: 3px; }

  .result-flag {
    border-radius: 10px;
    padding: 13px 16px;
    font-size: 12.5px;
    line-height: 1.6;
    font-weight: 600;
  }
  .result-flag.warn {
    background: rgba(180,83,9,0.07);
    border: 1px solid rgba(180,83,9,0.28);
    color: #b45309;
  }
  .result-flag.fail {
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    color: var(--error);
  }

  .label-with-help {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .help-tip {
    position: relative;
    display: inline-grid;
    place-items: center;
    width: 19px;
    height: 19px;
    padding: 0;
    border: 1px solid var(--bstc-border);
    border-radius: 50%;
    background: rgba(33, 170, 255, 0.10);
    color: var(--bstc);
    font: 700 12px/1 Arial, Helvetica, sans-serif;
    cursor: help;
  }

  .help-tip::after {
    content: attr(data-tip);
    position: absolute;
    z-index: 20;
    left: 50%;
    bottom: calc(100% + 9px);
    width: min(270px, 75vw);
    padding: 10px 12px;
    border-radius: 9px;
    background: #101828;
    color: #ffffff;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.45;
    text-align: left;
    box-shadow: 0 10px 30px rgba(16, 24, 40, 0.22);
    transform: translate(-50%, 5px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
  }

  .help-tip:hover::after,
  .help-tip:focus::after {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
  }

  .compact-results {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .result-metric {
    min-height: 165px;
    padding: 22px;
    border: 1px solid rgba(33, 170, 255, 0.28);
    border-radius: 13px;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .result-metric .metric-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .result-metric .metric-value {
    display: block;
    width: 100%;
    min-width: 0;
    margin-top: 10px;
    color: var(--bstc);
    font-size: clamp(34px, 5vw, 54px);
    font-weight: 800;
    line-height: 0.98;
    letter-spacing: -0.05em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .result-disclaimer {
    padding: 0 22px 22px;

<body>

<div class="page-header">

      </div>

        <label>Property Type</label>
        <select id="bess-property" onchange="updateBessFields()">

          <button type="button" class="help-tip" aria-label="Battery capacity guidance" data-tip="Enter the battery's usable capacity. If only nominal capacity is known, usable capacity may be estimated as nominal capacity × 90%.">i</button>

<script type="text/plain" id="legacy-calculator-code">
// Period schedule: [startDate (inclusive), endDate (inclusive), label, factor]
// Dates as YYYY-MM-DD strings for easy comparison
const PERIOD_SCHEDULE = [
  { from: '2026-01-01', to: '2026-04-30', label: 'Jan–Apr 2026', factor: 8.4 },
  { from: '2026-05-01', to: '2026-12-31', label: 'May–Dec 2026', factor: 6.8 },
  { from: '2027-01-01', to: '2027-06-30', label: 'Jan–Jun 2027', factor: 5.7 },
  { from: '2027-07-01', to: '2027-12-31', label: 'Jul–Dec 2027', factor: 5.2 },
  { from: '2028-01-01', to: '2028-06-30', label: 'Jan–Jun 2028', factor: 4.6 },
  { from: '2028-07-01', to: '2028-12-31', label: 'Jul–Dec 2028', factor: 4.1 },
  { from: '2029-01-01', to: '2029-06-30', label: 'Jan–Jun 2029', factor: 3.6 },
  { from: '2029-07-01', to: '2029-12-31', label: 'Jul–Dec 2029', factor: 3.1 },
  { from: '2030-01-01', to: '2030-06-30', label: 'Jan–Jun 2030', factor: 2.6 },
  { from: '2030-07-01', to: '2030-12-31', label: 'Jul–Dec 2030', factor: 2.1 },
];

function getPeriod(dateStr) {
  if (!dateStr) return null;
  for (const p of PERIOD_SCHEDULE) {
    if (dateStr >= p.from && dateStr <= p.to) return p;
  }
  return null;
}

function fmt(n, d=0) {
  return n.toLocaleString('en-AU', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtD(n) {
  return '$' + n.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtF(n) {
  return n.toLocaleString('en-AU', { minimumFractionDigits: 1, maximumFractionDigits: 4 });
}
function fmtDate(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

// Live factor preview on date change
document.addEventListener('DOMContentLoaded', function() {
  const dateInput = document.getElementById('install-date');
  const preview   = document.getElementById('factor-preview');
  if (!dateInput || !preview) return;
  dateInput.addEventListener('change', function() {
    const p = getPeriod(this.value);
    if (p) {
      preview.style.display = 'block';
      preview.textContent = `Period: ${p.label}  ·  STC Factor: ${p.factor}`;
    } else if (this.value) {
      preview.style.display = 'block';
      preview.style.color = '#b42318';
      preview.style.background = '#fff1f0';
      preview.style.borderColor = '#fecdca';
      preview.textContent = 'Date is outside the eligible BSTC period (1 Jan 2026 – 31 Dec 2030).';
    } else {
      preview.style.display = 'none';
    }
  });
});

function calculateBSTC() {
  const errBox = document.getElementById('error-box');
  errBox.classList.remove('show');
  errBox.innerHTML = '';

  const dateStr = document.getElementById('install-date').value;
  const nominalRaw = parseFloat(document.getElementById('nominal-kwh').value);
  const kwhRaw     = parseFloat(document.getElementById('battery-kwh').value);
  const spotRaw = parseFloat(document.getElementById('bstc-price').value);

  const errs = [];
  if (!dateStr)                            errs.push('Enter an installation date.');
  const period = dateStr ? getPeriod(dateStr) : null;
  if (dateStr && !period)                  errs.push('Installation date is outside the eligible BSTC period (1 Jan 2026 – 31 Dec 2030).');
  if (isNaN(nominalRaw) || nominalRaw <= 0) {
    errs.push('Enter a valid nominal battery capacity in kWh.');
  } else if (nominalRaw < 5 || nominalRaw > 100) {
    errs.push('Ineligible: nominal battery capacity must be between 5 kWh and 100 kWh.');
  }
  if (isNaN(kwhRaw) || kwhRaw <= 0) {
    errs.push('Enter a valid usable battery capacity in kWh.');
  }

  if (isNaN(spotRaw) || spotRaw < 0)       errs.push('Enter a valid BSTC spot price (use 0 if unknown).');

  if (errs.length) {
    errBox.innerHTML = errs.map(e => `• ${e}`).join('<br>');
    errBox.classList.add('show');
    return;
  }

  const clipped = kwhRaw > 50;
  const kwh = Math.min(kwhRaw, 50);
  const { label: periodLabel, factor: F } = period;

  // Taper bands
  const band1_kwh  = Math.min(kwh, 14);
  const band2_kwh  = Math.max(0, Math.min(kwh, 28) - 14);
  const band3_kwh  = Math.max(0, Math.min(kwh, 50) - 28);

  const band1_raw  = band1_kwh * F;
  const band2_raw  = band2_kwh * F * 0.60;
  const band3_raw  = band3_kwh * F * 0.15;

  const totalRaw   = band1_raw + band2_raw + band3_raw;
  const bstcCount  = Math.floor(totalRaw);
  const bstcValue  = bstcCount * spotRaw;

  // Determine which bands are active
  const b2active = band2_kwh > 0;
  const b3active = band3_kwh > 0;

  let html = `
  <div class="client-summary">
    <div class="summary-header">
      <div class="summary-title"><span>Battery STC Estimate</span></div>
    </div>
    <div class="summary-body">
      <div class="summary-grid">
        <div class="summary-item"><span class="s-label">Installation Date</span><span class="s-value">${fmtDate(dateStr)}</span></div>
        <div class="summary-item"><span class="s-label">Nominal Capacity</span><span class="s-value">${fmtF(nominalRaw)} kWh</span></div>
        <div class="summary-item"><span class="s-label">Usable Capacity</span><span class="s-value">${clipped ? `${fmtF(kwhRaw)} kWh<br><span style="color:#b45309;font-size:11px;">Calculated at 50 kWh cap</span>` : `${fmtF(kwh)} kWh`}</span></div>
        <div class="summary-item"><span class="s-label">Eligible BSTCs</span><span class="s-value">${fmt(bstcCount)} BSTCs</span></div>
        <div class="summary-item"><span class="s-label">STC Factor</span><span class="s-value">${F}<br><span style="color:#667085;font-size:12px;">${periodLabel}</span></span></div>
        <div class="summary-item"><span class="s-label">Spot Price incl. fees</span><span class="s-value">${fmtD(spotRaw)} / BSTC</span></div>
      </div>
      <div class="hero-value">
        <span class="hero-label">Estimated Net Payment to Customer</span>
        <div class="hero-amount">${fmtD(bstcValue)}</div>
      </div>
    </div>
    <div class="client-narrative">
      <strong>Important:</strong> The estimated net payment shown is based on the nominated BSTC spot price (including fees) entered above. Final BSTC creation, assignment value and payment are subject to system eligibility, installation compliance requirements and applicable Clean Energy Regulator requirements.
    </div>
  </div>

  ${clipped ? `<div style="padding:14px 16px;border:1px solid rgba(180,83,9,0.28);border-radius:14px;background:rgba(180,83,9,0.07);color:#b45309;font-size:12.5px;font-weight:600;line-height:1.55;">Entered capacity (${fmtF(kwhRaw)} kWh) exceeds the 50 kWh BSTC claim cap. This estimate has been calculated using the first 50 kWh of usable capacity only. Usable capacity above 50 kWh does not generate additional BSTCs. Eligibility is assessed separately against the entered nominal battery capacity.</div>` : ''}


  <details class="methodology">
    <summary>Certificate Calculation Methodology</summary>
    <div class="taper-breakdown">
      <div class="tb-header">Taper Band Breakdown</div>
      <div class="tb-row">
        <span class="tb-band">Band 1 · 0-14 kWh · 100%</span>
        <span class="tb-calc">${fmtF(band1_kwh)} kWh × ${F} × 100% = ${fmtF(band1_raw)}</span>
        <span class="tb-result">${fmtF(band1_raw)}</span>
      </div>
      <div class="tb-row${b2active ? '' : ' inactive'}">
        <span class="tb-band">Band 2 · 14-28 kWh · 60%</span>
        <span class="tb-calc">${b2active ? `${fmtF(band2_kwh)} kWh × ${F} × 60% = ${fmtF(band2_raw)}` : 'Not applicable'}</span>
        <span class="tb-result">${b2active ? fmtF(band2_raw) : '—'}</span>
      </div>
      <div class="tb-row${b3active ? '' : ' inactive'}">
        <span class="tb-band">Band 3 · 28-50 kWh · 15%</span>
        <span class="tb-calc">${b3active ? `${fmtF(band3_kwh)} kWh × ${F} × 15% = ${fmtF(band3_raw)}` : 'Not applicable'}</span>
        <span class="tb-result">${b3active ? fmtF(band3_raw) : '—'}</span>
      </div>
      <div class="tb-total">
        <span>floor(${fmtF(totalRaw)}) = ${fmt(bstcCount)} BSTCs</span>
        <span>${fmtD(bstcValue)}</span>
      </div>
    </div>
  </details>`

  document.getElementById('results-panel').innerHTML = html;
}

/* ===================== Multi-scheme dispatch ===================== */

let currentScheme = 'bstc';

const NLF_LABELS = { '1.04': 'Ausgrid', '1.05': 'Endeavour / Essential Energy' };

const SCHEME_META = {
  bstc:  { label: 'Battery STC Calculator',        btn: 'Calculate BSTCs', panel: 'Battery Installation Parameters', empty: 'Calculate BSTCs' },
  bess3: { label: 'BESS3 · PRC Calculator (Apartments)',              btn: 'Calculate PRCs', panel: 'BESS3 Implementation Parameters', empty: 'Calculate PRCs' },
  bess4: { label: 'BESS4 · PRC Calculator (Small/Medium Business)',   btn: 'Calculate PRCs', panel: 'BESS4 Implementation Parameters', empty: 'Calculate PRCs' },
  bess5: { label: 'BESS5 · PRC Calculator (Commercial/Industrial)',   btn: 'Calculate PRCs', panel: 'BESS5 Implementation Parameters', empty: 'Calculate PRCs' },
};

function switchScheme(scheme) {
  currentScheme = scheme;
  document.querySelectorAll('.scheme-tab').forEach(t => t.classList.toggle('active', t.dataset.scheme === scheme));
  ['bstc','bess3','bess4','bess5'].forEach(s => {
    document.getElementById('fg-' + s).style.display = (s === scheme) ? 'flex' : 'none';
  });
  const meta = SCHEME_META[scheme];
  const paramsLabel = document.getElementById('params-label');
  paramsLabel.textContent = meta.panel;
  paramsLabel.style.display = (scheme === 'bstc') ? 'block' : 'none';
  document.getElementById('calc-btn').textContent = meta.btn;
  const emptyCta = document.getElementById('empty-cta');
  if (emptyCta) emptyCta.textContent = meta.empty;
  document.getElementById('error-box').classList.remove('show');
  document.getElementById('error-box').innerHTML = '';
  document.getElementById('results-panel').innerHTML = `
    <div class="empty-state">
      <div class="icon">🔋</div>
      Enter installation details and click<br><strong>${meta.btn}</strong> to see results.
    </div>`;
}

function calculate() {
  if (currentScheme === 'bstc') { calculateBSTC(); return; }
  calculateBESS(currentScheme);
}

function checklistOk(ids) {
  return ids.every(id => document.getElementById(id).checked);
}

function calculateBESS(scheme) {
  const errBox = document.getElementById('error-box');
  errBox.classList.remove('show');
  errBox.innerHTML = '';

  const p = scheme.replace('bess', 'b'); // b3 / b4 / b5
  const dateStr   = document.getElementById(p + '-date').value;
  const nominalRaw = parseFloat(document.getElementById(p + '-kwh').value);
  const kwhRaw     = nominalRaw * 0.90;
  const invRaw    = parseFloat(document.getElementById(p + '-inverter').value);
  const solar90   = document.getElementById(p + '-solar90').value === 'yes';
  const nlf       = parseFloat(document.getElementById(p + '-dnsp').value);
  const spotRaw   = parseFloat(document.getElementById(p + '-price').value);
  const dwellings = (scheme === 'bess3') ? parseInt(document.getElementById('b3-dwellings').value) : null;

  const errs = [];
  if (!dateStr) errs.push('Enter an Implementation Date.');
  else if (dateStr < '2026-09-01') errs.push('Implementation Date must be on or after 1 September 2026 (BESS3/4/5 commencement).');

  const bandLabel = { bess3: '>20–≤200 kWh', bess4: '>20–≤200 kWh', bess5: '>200–≤30,000 kWh' }[scheme];
  const bandMin = { bess3: 20, bess4: 20, bess5: 200 }[scheme];
  const bandMax = { bess3: 200, bess4: 200, bess5: 30000 }[scheme];

  if (isNaN(nominalRaw) || nominalRaw <= 0) errs.push('Enter a valid Nominal Battery Capacity in kWh.');
  else if (kwhRaw <= bandMin || kwhRaw > bandMax) errs.push(`Ineligible: derived Usable Battery Capacity (Nominal × 90%) must be ${bandLabel} for ${scheme.toUpperCase()}.`);

  if (isNaN(invRaw) || invRaw <= 0) errs.push('Enter a valid Battery Inverter Output in kW.');
  else if (!isNaN(nominalRaw) && kwhRaw > invRaw * 6) errs.push('Ineligible: derived Usable Battery Capacity (Nominal × 90%) must not exceed 6× the Battery Inverter Output.');

  if (scheme === 'bess3') {
    if (isNaN(dwellings) || dwellings < 4) errs.push('Enter a valid number of dwellings (minimum 4).');
  }

  if (isNaN(spotRaw) || spotRaw < 0) errs.push('Enter a valid PRC spot price (use 0 if unknown).');

  const eligIds = {
    bess3: ['b3-e1','b3-e2','b3-e3','b3-e4'],
    bess4: ['b4-e1','b4-e2','b4-e3','b4-e4'],
    bess5: ['b5-e1','b5-e2','b5-e3','b5-e4'],
  }[scheme];
  if (!checklistOk(eligIds)) errs.push('Confirm all eligibility requirements below before calculating — each must be checked.');

  if (errs.length) {
    errBox.innerHTML = errs.map(e => `• ${e}`).join('<br>');
    errBox.classList.add('show');
    return;
  }

  // Battery Capacity (as defined per Activity Definition) and Demand Shifting Component
  let batteryCapacity, dsc, formulaLabel, rateLabel;
  const fourHrInv = invRaw * 4;

  if (scheme === 'bess3') {
    const dwellingCap = dwellings * 5;
    batteryCapacity = Math.min(kwhRaw, dwellingCap, fourHrInv);
    const rate = solar90 ? 0.12 : 0.0853;
    dsc = batteryCapacity * rate;
    formulaLabel = solar90 ? 'BESS3.2' : 'BESS3.3';
    rateLabel = `${rate} kW/kWh`;
  } else if (scheme === 'bess4') {
    batteryCapacity = Math.min(kwhRaw, fourHrInv);
    const baseRate = solar90 ? 0.1 : 0.067;
    if (batteryCapacity <= 50) {
      dsc = batteryCapacity * baseRate * 0.5;
      formulaLabel = solar90 ? 'BESS4.2A' : 'BESS4.3A';
    } else if (batteryCapacity <= 100) {
      dsc = (50 * baseRate * 0.5) + ((batteryCapacity - 50) * baseRate * 0.7);
      formulaLabel = solar90 ? 'BESS4.2B' : 'BESS4.3B';
    } else {
      dsc = batteryCapacity * baseRate;
      formulaLabel = solar90 ? 'BESS4.2C' : 'BESS4.3C';
    }
    rateLabel = `${baseRate} kW/kWh`;
  } else { // bess5
    batteryCapacity = Math.min(kwhRaw, 10000, fourHrInv);
    const rate = solar90 ? 0.1 : 0.067;
    dsc = batteryCapacity * rate;
    formulaLabel = solar90 ? 'BESS5.2' : 'BESS5.3';
    rateLabel = `${rate} kW/kWh`;
  }

  const firmnessFactor = 1;
  const pdsc = dsc * firmnessFactor;      // Peak Demand Shifting Capacity
  const lifetime = 15;
  const summerDuration = 6;
  const pdrc = pdsc * summerDuration * lifetime; // Equation 2b
  const totalRaw = pdrc * nlf * 10;              // Equation 1
  const prcCount = Math.floor(totalRaw);
  const prcValue = prcCount * spotRaw;

  const activityLabel = { bess3: 'BESS3', bess4: 'BESS4', bess5: 'BESS5' }[scheme];
  const siteLabel = { bess3: 'Apartment Building', bess4: 'Small/Medium Business', bess5: 'Commercial/Industrial' }[scheme];
  const solarConfiguration = solar90
    ? 'With New Solar PV<br><span style="color:#667085;font-size:12px;">Installed within 90 days</span>'
    : 'Without New Solar PV<br><span style="color:#667085;font-size:12px;">Or installed outside 90 days</span>';

  let html = `
  <div class="client-summary">
    <div class="summary-header">
      <div class="summary-title"><span>${activityLabel} Peak Reduction Certificate Estimate</span></div>
    </div>
    <div class="summary-body">
      <div class="summary-grid">
        <div class="summary-item"><span class="s-label">Implementation Date</span><span class="s-value">${fmtDate(dateStr)}</span></div>
        <div class="summary-item"><span class="s-label">Site Type</span><span class="s-value">${siteLabel}</span></div>
        <div class="summary-item"><span class="s-label">Solar Configuration</span><span class="s-value">${solarConfiguration}</span></div>
        <div class="summary-item"><span class="s-label">Nominal Capacity</span><span class="s-value">${fmtF(nominalRaw)} kWh</span></div>
        <div class="summary-item"><span class="s-label">Usable Capacity</span><span class="s-value">${fmtF(kwhRaw)} kWh<br><span style="color:#667085;font-size:12px;">90% of nominal</span></span></div>
        <div class="summary-item"><span class="s-label">Eligible PRCs</span><span class="s-value">${fmt(prcCount)} PRCs</span></div>
        <div class="summary-item"><span class="s-label">Network Loss Factor</span><span class="s-value">${nlf}<br><span style="color:#667085;font-size:12px;">${NLF_LABELS[String(nlf)] || ''}</span></span></div>
        <div class="summary-item"><span class="s-label">Spot Price incl. fees</span><span class="s-value">${fmtD(spotRaw)} / PRC</span></div>
      </div>
      <div class="hero-value">
        <span class="hero-label">Estimated Net Payment to Customer</span>
        <div class="hero-amount">${fmtD(prcValue)}</div>
      </div>
    </div>
    <div class="client-narrative">
      <strong>Important:</strong> The estimated net payment shown is based on the nominated PRC spot price (including fees) entered above. Final PRC creation, assignment value and payment are subject to system eligibility, Scheme Administrator approved product/installer listing, installation compliance requirements and applicable PDRS Rule requirements. This estimate does not resolve the outstanding solar PV co-installation or minimum co-payment items flagged for this activity — confirm those with the Scheme Administrator before relying on this figure in client-facing advice.
    </div>
  </div>

  <details class="methodology">
    <summary>Certificate Calculation Methodology</summary>
    <div class="taper-breakdown">
      <div class="tb-header">${activityLabel} PRC Calculation Steps</div>
      <div class="tb-row">
        <span class="tb-band">Battery Capacity (capped)</span>
        <span class="tb-calc">Nominal ${fmtF(nominalRaw)} kWh × 90% = ${fmtF(kwhRaw)} kWh usable; lesser of applicable caps applied</span>
        <span class="tb-result">${fmtF(batteryCapacity)} kWh</span>
      </div>
      <div class="tb-row">
        <span class="tb-band">Demand Shifting Component (Eq. ${formulaLabel})</span>
        <span class="tb-calc">${fmtF(batteryCapacity)} kWh × ${rateLabel}${scheme === 'bess4' && batteryCapacity > 50 ? ' (tiered)' : ''}</span>
        <span class="tb-result">${fmtF(dsc, 3)} kW</span>
      </div>
      <div class="tb-row">
        <span class="tb-band">Peak Demand Shifting Capacity</span>
        <span class="tb-calc">${fmtF(dsc, 3)} kW × Firmness Factor ${firmnessFactor}</span>
        <span class="tb-result">${fmtF(pdsc, 3)} kW</span>
      </div>
      <div class="tb-row">
        <span class="tb-band">Peak Demand Reduction Capacity (Eq. 2b)</span>
        <span class="tb-calc">${fmtF(pdsc, 3)} kW × ${summerDuration} hrs × ${lifetime} yrs</span>
        <span class="tb-result">${fmtF(pdrc, 2)} kW</span>
      </div>
      <div class="tb-total">
        <span>floor(${fmtF(pdrc, 2)} × ${nlf} × 10) = ${fmt(prcCount)} PRCs</span>
        <span>${fmtD(prcValue)}</span>
      </div>
    </div>
  </details>`;

  document.getElementById('results-panel').innerHTML = html;
}
</script>

<script>
/* Simplified public calculator experience */
const PERIOD_SCHEDULE_PUBLIC = [
  { from: '2026-01-01', to: '2026-04-30', factor: 8.4 },
  { from: '2026-05-01', to: '2026-12-31', factor: 6.8 },
  { from: '2027-01-01', to: '2027-06-30', factor: 5.7 },
  { from: '2027-07-01', to: '2027-12-31', factor: 5.2 },
  { from: '2028-01-01', to: '2028-06-30', factor: 4.6 },
  { from: '2028-07-01', to: '2028-12-31', factor: 4.1 },
  { from: '2029-01-01', to: '2029-06-30', factor: 3.6 },
  { from: '2029-07-01', to: '2029-12-31', factor: 3.1 },
  { from: '2030-01-01', to: '2030-06-30', factor: 2.6 },
  { from: '2030-07-01', to: '2030-12-31', factor: 2.1 }
];

const PUBLIC_STC_PRICE = 39.90;
const PUBLIC_PRC_PRICE = 2.80;
const PUBLIC_DISCLAIMER = `This calculator provides an indicative estimate only. It assumes the entered battery capacity is usable capacity; where only nominal capacity is known, usable capacity may be estimated as 90% of nominal capacity. It also assumes all applicable site, nominal-capacity, product, installer, metering and scheme eligibility requirements are satisfied. The inverter output is assumed to be sufficient under the applicable four-hour capacity cap. STC estimates apply the scheme's usable-capacity claim cap. Values are based on indicative prices of $39.90 per STC and $2.80 per PRC and may change. Final eligibility, certificate quantity and payment remain subject to supporting evidence, Northmore Gordon review and scheme-administrator approval.`;

let currentScheme = 'stc';

function getPublicStcPeriod(dateStr) {
  if (!dateStr) return null;
  return PERIOD_SCHEDULE_PUBLIC.find(period => dateStr >= period.from && dateStr <= period.to) || null;
}

function fmt(n, digits = 0) {
  return n.toLocaleString('en-AU', {
    minimumFractionDigits: digits,
    maximumFractionDigits: digits
  });
}

function fmtD(n) {
  return '$' + n.toLocaleString('en-AU', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function updateBessFields() {
  const isApartment = document.getElementById('bess-property').value === 'apartment';
  document.getElementById('bess-dwellings-field').style.display = isApartment ? 'flex' : 'none';
  sendFrameHeight();
}

function switchScheme(scheme) {
  currentScheme = scheme;
  document.querySelectorAll('.scheme-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.scheme === scheme);
  });

  document.getElementById('fg-bstc').style.display = scheme === 'stc' ? 'flex' : 'none';
  document.getElementById('fg-bess').style.display = scheme === 'bess' ? 'flex' : 'none';

  const isStc = scheme === 'stc';
  document.getElementById('params-label').textContent = 'Installation Details';
  document.getElementById('calc-btn').textContent = isStc ? 'Calculate STCs' : 'Calculate PRCs';
  document.getElementById('error-box').classList.remove('show');
  document.getElementById('error-box').innerHTML = '';
  document.getElementById('results-panel').innerHTML = `
    <div class="empty-state">
      <div class="icon">🔋</div>
      Enter installation details and click<br><strong>${isStc ? 'Calculate STCs' : 'Calculate PRCs'}</strong> to see results.
    </div>`;

  if (!isStc) updateBessFields();
  sendFrameHeight();
}

function calculate() {
  if (currentScheme === 'stc') calculatePublicStc();
  else calculatePublicBess();
}

function showPublicErrors(errors) {
  const errBox = document.getElementById('error-box');
  errBox.innerHTML = errors.map(error => `• ${error}`).join('<br>');
  errBox.classList.toggle('show', errors.length > 0);
  sendFrameHeight();
}

function renderPublicResult(kind, count, value) {
  const isStc = kind === 'STC';
  const title = isStc ? 'Battery STC Estimate' : 'BESS PRC Estimate';

  document.getElementById('results-panel').innerHTML = `
    <div class="client-summary">
      <div class="summary-header">
        <div class="summary-title">
          <span>${title}</span>
        </div>
      </div>
      <div class="summary-body">
        <div class="compact-results">
          <div class="result-metric">
            <span class="metric-label">Estimated ${kind}s</span>
            <span class="metric-value">${fmt(count)}</span>
          </div>
          <div class="result-metric">
            <span class="metric-label">Estimated Value</span>
            <span class="metric-value">${fmtD(value)}</span>
          </div>
        </div>
      </div>
      <div class="result-disclaimer">
        <strong>Important:</strong> ${PUBLIC_DISCLAIMER}
        <span class="contact-prompt">Contact Northmore Gordon for a detailed assessment.</span>
      </div>
    </div>`;

  requestAnimationFrame(() => {
    fitResultMetricValues();
    sendFrameHeight();
  });
}

function fitResultMetricValues() {
  document.querySelectorAll('.result-metric .metric-value').forEach((element) => {
    element.style.fontSize = '';
    const minimumSize = 24;
    let fontSize = parseFloat(getComputedStyle(element).fontSize);

    while (element.scrollWidth > element.clientWidth && fontSize > minimumSize) {
      fontSize -= 1;
      element.style.fontSize = `${fontSize}px`;
    }
  });
}

function calculatePublicStc() {
  const dateStr = document.getElementById('install-date').value;
  const capacityRaw = parseFloat(document.getElementById('battery-kwh').value);
  const errors = [];

  if (!dateStr) errors.push('Enter an installation date.');
  const period = dateStr ? getPublicStcPeriod(dateStr) : null;
  if (dateStr && !period) {
    errors.push('Installation date must be between 1 January 2026 and 31 December 2030.');
  }
  if (isNaN(capacityRaw) || capacityRaw <= 0) {
    errors.push('Enter a valid battery capacity in kWh.');
  }

  showPublicErrors(errors);
  if (errors.length) return;

  const capacity = Math.min(capacityRaw, 50);
  const factor = period.factor;
  const band1 = Math.min(capacity, 14);
  const band2 = Math.max(0, Math.min(capacity, 28) - 14);
  const band3 = Math.max(0, Math.min(capacity, 50) - 28);
  const rawCertificates =
    (band1 * factor) +
    (band2 * factor * 0.60) +
    (band3 * factor * 0.15);
  const certificateCount = Math.floor(rawCertificates);

  renderPublicResult('STC', certificateCount, certificateCount * PUBLIC_STC_PRICE);
}

function calculatePublicBess() {
  const dateStr = document.getElementById('bess-date').value;
  const propertyType = document.getElementById('bess-property').value;
  const capacity = parseFloat(document.getElementById('bess-kwh').value);
  const solarWithin90Days = document.getElementById('bess-solar90').value === 'yes';
  const networkLossFactor = parseFloat(document.getElementById('bess-dnsp').value);
  const dwellings = propertyType === 'apartment'
    ? parseInt(document.getElementById('bess-dwellings').value, 10)
    : null;
  const errors = [];

  if (!dateStr) errors.push('Enter an installation date.');
  else if (dateStr < '2026-09-01') {
    errors.push('Installation date must be on or after 1 September 2026.');
  }

  if (isNaN(capacity) || capacity <= 0) {
    errors.push('Enter a valid battery capacity in kWh.');
  } else if (capacity <= 20 || capacity > 30000) {
    errors.push('Battery capacity must be above 20 kWh and no more than 30,000 kWh.');
  }

  if (propertyType === 'apartment') {
    if (isNaN(dwellings) || dwellings < 4) {
      errors.push('Enter at least 4 dwellings for an apartment building.');
    }
    if (!isNaN(capacity) && capacity > 200) {
      errors.push('Apartment-building estimates support battery capacity up to 200 kWh. Contact Northmore Gordon for a tailored assessment.');
    }
  }

  showPublicErrors(errors);
  if (errors.length) return;

  let eligibleCapacity;
  let demandShiftingComponent;

  if (propertyType === 'apartment') {
    eligibleCapacity = Math.min(capacity, dwellings * 5);
    const rate = solarWithin90Days ? 0.12 : 0.0853;
    demandShiftingComponent = eligibleCapacity * rate;
  } else if (capacity <= 200) {
    eligibleCapacity = capacity;
    const rate = solarWithin90Days ? 0.10 : 0.067;
    if (eligibleCapacity <= 50) {
      demandShiftingComponent = eligibleCapacity * rate * 0.5;
    } else if (eligibleCapacity <= 100) {
      demandShiftingComponent =
        (50 * rate * 0.5) +
        ((eligibleCapacity - 50) * rate * 0.7);
    } else {
      demandShiftingComponent = eligibleCapacity * rate;
    }
  } else {
    eligibleCapacity = Math.min(capacity, 10000);
    const rate = solarWithin90Days ? 0.10 : 0.067;
    demandShiftingComponent = eligibleCapacity * rate;
  }

  const peakDemandReductionCapacity = demandShiftingComponent * 6 * 15;
  const rawCertificates = peakDemandReductionCapacity * networkLossFactor * 10;
  const certificateCount = Math.floor(rawCertificates);

  renderPublicResult('PRC', certificateCount, certificateCount * PUBLIC_PRC_PRICE);
}

let frameResizeRequest = null;
let lastFrameHeight = 0;

function sendFrameHeight() {
  if (frameResizeRequest) cancelAnimationFrame(frameResizeRequest);
  frameResizeRequest = requestAnimationFrame(() => {
    const bodyStyle = getComputedStyle(document.body);
    const bottomPadding = parseFloat(bodyStyle.paddingBottom) || 0;
    const contentElements = [
      document.querySelector('.page-header'),
      document.querySelector('.layout')
    ].filter(Boolean);
    const contentBottom = Math.max(
      0,
      ...contentElements.map((element) => element.getBoundingClientRect().bottom)
    );
    const height = Math.ceil(window.scrollY + contentBottom + bottomPadding);

    if (height !== lastFrameHeight) {
      lastFrameHeight = height;
      window.parent.postMessage({ type: 'ng-calculator-resize', height }, '*');
    }

    frameResizeRequest = null;
  });
}

window.addEventListener('load', sendFrameHeight);
window.addEventListener('resize', () => {
  fitResultMetricValues();
  sendFrameHeight();
});
if ('ResizeObserver' in window) {
  const frameResizeObserver = new ResizeObserver(sendFrameHeight);
  const pageHeader = document.querySelector('.page-header');
  const calculatorLayout = document.querySelector('.layout');
  if (pageHeader) frameResizeObserver.observe(pageHeader);
  if (calculatorLayout) frameResizeObserver.observe(calculatorLayout);
}
switchScheme('stc');
</script>
</body>
</html>
